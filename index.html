<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShowTime – Book Movie Tickets</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fa;--panel:#fff;--ink:#16181f;--mute:#5d6272;--line:#e3e5ec;--accent:#d42a5b;--ok:#157a4a;--okbg:#e6f5ed}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px}
.hd{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.02em}.logo i{font-style:normal;color:var(--accent)}
.hd small{color:var(--mute);font-size:14px}
main{max-width:900px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;margin-right:8px}
.movie{display:flex;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.poster{flex:none;width:96px;height:136px;border-radius:10px;color:rgba(255,255,255,.9);display:grid;place-items:center;font-size:44px;font-weight:800}
.info{flex:1;min-width:0}
.info h3{margin:0;font-size:19px}
.meta{color:var(--mute);font-size:14px;margin:2px 0 12px}
.times{display:flex;flex-wrap:wrap;gap:10px}
.t{font:inherit;font-size:15px;font-weight:600;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;text-align:center;min-width:94px}
.t small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.t:hover{border-color:var(--accent)}
.t[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.t[aria-pressed="true"] small{color:#ffe3ec}
.t:focus-visible,button:focus-visible{outline:3px solid #8aa4ff;outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.cnt{color:var(--mute)}
.btns{display:flex;gap:8px}
button.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#fff}
button.g{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.plan{background:var(--panel);border:2px solid var(--ok);border-radius:14px;padding:18px;margin-bottom:22px}
.plan h2{margin:0 0 4px;font-size:22px}.plan h2 b{color:var(--ok)}
.tix{display:flex;gap:10px;overflow-x:auto;padding:14px 0}
.tk{flex:none;min-width:160px;background:var(--okbg);border-radius:10px;padding:10px 14px}
.tk b{display:block}.tk span{font-size:14px;color:var(--mute)}
details{margin-top:12px}summary{cursor:pointer;color:var(--mute)}
details li{margin:6px 0}
.ok{color:var(--ok);font-weight:600}.no{color:var(--mute)}
@media(max-width:480px){.poster{width:76px;height:108px;font-size:34px}h1{font-size:24px}}

.hero{position:relative;overflow:hidden;border-radius:16px;margin-bottom:22px;height:clamp(240px,38vw,350px);background:var(--nav)}
.slides{display:flex;height:100%;transition:transform .7s ease}
.slide{flex:0 0 100%;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end}
.slide .bg{position:absolute;inset:0;filter:blur(22px) brightness(.65);transform:scale(1.2)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,18,.85),rgba(8,8,18,.2) 75%)}
.cap{position:relative;z-index:1;padding:22px 26px 36px;max-width:58%}
.chip{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.cap h2{margin:0 0 2px;font-size:clamp(22px,4.2vw,36px);line-height:1.15}
.cap p{margin:0 0 6px;color:#e6e7f0}
.cap .rt{font-weight:700;color:#ffd166}
.pic{position:absolute;z-index:1;right:6%;top:8%;bottom:8%;aspect-ratio:2/3;border-radius:10px;display:grid;place-items:center;font-size:48px;font-weight:800;color:rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.nv{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer}
.nv:hover{background:rgba(0,0,0,.7)}.prev{left:10px}.next{right:10px}
.dots{position:absolute;z-index:2;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#fff;width:24px;border-radius:6px}
.rating{font-size:14px;margin:2px 0 0}.star{color:#e6a100}.rating small{color:var(--mute)}
@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--accent)}}
.movie.flash{animation:fl 1.3s}
@media(max-width:480px){.cap{max-width:62%;padding:16px 16px 34px}.pic{font-size:30px}}
@media(prefers-reduced-motion:reduce){.slides{transition:none}.movie.flash{animation:none}}
.poster{position:relative;overflow:hidden}.pic{overflow:hidden}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.th button{font:inherit;font-weight:600;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.th button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.th button:focus-visible{outline:3px solid #8aa4ff;outline-offset:2px}

.hd{flex-wrap:wrap;justify-content:flex-start;gap:10px 16px}
a.logo{color:inherit;text-decoration:none}
.srch{flex:1 1 240px}.vh{position:absolute;left:-9999px}
.srch input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
.hr{display:flex;align-items:center;gap:10px}
.city,.menu{font:inherit;font-weight:600;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 4px}
.menu{font-size:22px;line-height:1}
.btnlink{display:inline-block;background:var(--accent);color:#fff;font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 16px;text-decoration:none;cursor:pointer}
.city:focus-visible,.menu:focus-visible,.btnlink:focus-visible,.srch input:focus,.sheet input:focus{outline:3px solid #8aa4ff;outline-offset:2px}
@media(max-width:600px){.srch{order:3;flex-basis:100%}.hr{margin-left:auto}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:60px 16px}
.ov.show{display:flex}
.sheet{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.sh,.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h2,.dh h2{margin:0;font-size:20px}
.xb{font:inherit;font-size:24px;line-height:1;background:none;border:0;color:var(--mute);cursor:pointer}
.sheet input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.det{margin-bottom:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.cc{font:inherit;font-weight:600;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.cc[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ord{border-top:1px solid var(--line);padding:10px 0;font-size:14px}.ord:first-child{border-top:0}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}.bd.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--panel);z-index:21;transform:translateX(100%);transition:transform .25s;overflow:auto;padding:18px}
.drawer.show{transform:none}
.dcard{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px}
.dcard p{margin:0;flex:1;color:var(--accent);font-weight:600}.gift{font-size:28px}
.ditem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer}
.ditem small{display:block;color:var(--mute);font-weight:400}
.ditem.lock{opacity:.55}
.ditem:focus-visible,.xb:focus-visible,.cc:focus-visible{outline:3px solid #8aa4ff;outline-offset:2px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.show{opacity:1}
#list:empty::before{content:"No movies match your search at this theatre.";color:var(--mute)}
@media(prefers-reduced-motion:reduce){.drawer,#toast{transition:none}}
</style>
</head>
<body>
<header><div class="hd">
  <a class="logo" href="showtime-booking.html">Show<i>Time</i></a>
  <label class="srch"><span class="vh">Search movies</span><input id="q" type="search" placeholder="Search for movies" autocomplete="off"></label>
  <div class="hr">
    <button class="city" id="cityBtn" aria-haspopup="dialog"><span id="cityName">Hyderabad</span> <span aria-hidden="true">▾</span></button>
    <a class="btnlink" id="signin" href="login.html">Sign in</a>
    <button class="menu" id="menuBtn" aria-label="Open menu">☰</button>
  </div></div></header>
<main>
  <div class="hero" id="hero" role="region" aria-roledescription="carousel" aria-label="Featured movies"></div>
  <h1>Movies today</h1>
  <p class="sub">Choose a theatre, then the showtimes you like. We pick the most shows you can watch with no overlap.</p>
  <ol class="steps"><li>Pick theatre and showtimes</li><li>Plan my day</li><li>Pay</li></ol>
  <div class="th" id="th" role="group" aria-label="Choose a theatre"></div>
  <p class="sub" id="thinfo"></p>
  <div id="plan"></div>
  <div id="list"></div>
</main>
<div class="ov" id="cityOv" role="dialog" aria-modal="true" aria-labelledby="cityT"><div class="sheet">
  <div class="sh"><h2 id="cityT">Select your city</h2><button class="xb" data-close aria-label="Close">×</button></div>
  <input id="cq" type="search" placeholder="Search for your city" autocomplete="off">
  <button class="btnlink det" id="detect" type="button">Detect my location</button>
  <p class="sub" id="cmsg" role="status"></p>
  <div class="cgrid" id="cityGrid"></div></div></div>
<div class="ov" id="ordOv" role="dialog" aria-modal="true" aria-labelledby="ordT"><div class="sheet">
  <div class="sh"><h2 id="ordT">Your orders</h2><button class="xb" data-close aria-label="Close">×</button></div>
  <div id="ordList"></div></div></div>
<div class="bd" id="bd"></div>
<aside class="drawer" id="drawer" aria-label="Menu"><div class="dh"><h2>Hey!</h2><button class="xb" data-close aria-label="Close menu" id="dx">×</button></div><div id="dbody"></div></aside>
<div id="toast" role="status" aria-live="polite"></div>
<div class="bar"><div class="bar-in">
  <span class="cnt" id="cnt"></span>
  <div class="btns"><button class="b g" id="reset">Clear</button><button class="b" id="go">Plan my day</button></div>
</div></div>
<script>
// EDIT YOUR MOVIES HERE.
// t = movie name, g = genre · language, d = duration in minutes,
// p = ticket price in rupees, r = rating out of 10, v = number of votes (text),
// img = poster image path (leave "" to use the colour block),
// times = start times in 24-hour format (13.5 means 1:30 PM)
const movies=[
{t:"Devara",g:"Action · Telugu",d:150,p:250,r:8.2,v:"98K",c:"#1f5fbf,#13203f",img:"devara.jpg",th:[0,1,2],times:[9,12.5,16,19.5]},
{t:"Dhurandhar",g:"Action · Hindi",d:160,p:280,r:8.6,v:"120K",c:"#7a1f3d,#2b2d42",img:"dhurandhar.jpg",th:[0,1,3],times:[10,13.5,17,20.5]},
{t:"Pushpa",g:"Action · Telugu",d:165,p:260,r:8.9,v:"210K",c:"#b32d2d,#3a1010",img:"pushpa.jpg",th:[1,2,3],times:[9.5,13,16.5,20]},
{t:"Spider",g:"Animation · English",d:120,p:220,r:8.0,v:"64K",c:"#8e44ad,#3b1a52",img:"spider.webp",th:[0,3],times:[10.5,14,17.5]},
{t:"The Last Naruto",g:"Anime · Japanese",d:112,p:200,r:7.8,v:"45K",c:"#d9822b,#7a3b12",img:"thelastnarutomovie.jpg",th:[1,2],times:[11,15,18.5]},
{t:"The Paradise",g:"Action · Telugu",d:140,p:240,r:8.1,v:"52K",c:"#1a7a6d,#0e2f33",img:"theparadise.jpg",th:[0,2,3],times:[9,12,15.5,19]},
{t:"IRUMUDI",g:"Thriller · Telugu",d:130,p:250,r:8.3,v:"38K",c:"#7a1f3d,#2b2d42",img:"irumudi.jpeg",th:[0,1],times:[10,13,16.5,20]},
{t:"Jersey",g:"emotiomal sports drama · Telugu",d:120,p:200,r:7.9,v:"41K",c:"#d9822b,#7a3b12",img:"jersey.jpeg",th:[2,3],times:[9.5,12.5,15.5,19]},
{t:"Dude",g:"Drama, Thriller, Emotional · Telugu",d:150,p:300,r:8.5,v:"73K",c:"#1f5fbf,#13203f",img:"dude.jpeg",th:[0,1,2,3],times:[11,14.5,18,21.5]},
{t:"Sardar",g:"Thriller · Telugu, Tamil",d:140,p:220,r:8.4,v:"29K",c:"#1a7a6d,#0e2f33",img:"sardar2.jpeg",th:[1,3],times:[10.5,15,19.5]},
{t:"Naturo",g:"Action, Drama · Japanese, Telugu",d:135,p:280,r:8.0,v:"57K",c:"#b32d2d,#3a1010",img:"narutofirst.jpeg",th:[0,2],times:[9,12,17,21]},
{t:"Hanuman Ansh",g:"Devotional Drama · Telugu",d:95,p:180,r:7.7,v:"33K",c:"#8e44ad,#3b1a52",img:"hanuman.jpeg",th:[0,1,2,3],times:[10,12.5,15,17.5]},
{t:"Arjun Reddy",g:"Romantic Drama · Telugu",d:135,p:230,r:8.2,v:"36K",c:"#c2185b,#3b0f2a",img:"reddy.jpeg",th:[1,2],times:[10,13.5,17,20.5]},
{t:"MS Dhoni The Untold Story",g:"Biographical sports Drama · Telugu",d:110,p:240,r:9.6,v:"100K",c:"#33415c,#0d1321",img:"msd.jpeg",th:[0,3],times:[11.5,15,18.5,21.5]},
{t:"Mirzapur",g:"Action · Hindi",d:145,p:260,r:8.4,v:"61K",c:"#2e7d32,#10341a",img:"pur.jpeg",th:[1,2,3],times:[9.5,13,16.5,20]},
{t:"Youth",g:"Comedy, Drama · Telugu",d:125,p:190,r:8.0,v:"22K",c:"#f9a825,#7a4a05",img:"yy.jpeg",th:[0,2],times:[9,12,15,18]},
{t:"AVENGERS End Game",g:"Action · English",d:128,p:250,r:8.1,v:"31K",c:"#5d4037,#1c1210",img:"end.jpeg",th:[0,1,3],times:[10.5,14,17.5,21]},
{t:"The Amazing Spider Man",g:"Action · Telugu",d:170,p:300,r:8.7,v:"84K",c:"#8d6e1f,#2a1e08",img:"amazing.jpeg",th:[0,1,2],times:[9,13,17,21]}];
// THEATRES: n = name, a = area/screens, sc = number of screens, sh = hours added to every start time at this theatre
const theatres=[
{n:"Galaxy Cinemas",a:"City Centre · 4 screens",sc:4,sh:0},
{n:"Starline Multiplex",a:"North Mall · 6 screens",sc:6,sh:0.5},
{n:"Royal Screens",a:"East Plaza · 3 screens",sc:3,sh:-0.5},
{n:"Silver Oak Theatre",a:"Old Town · 2 screens",sc:2,sh:1}];
// th on each movie = which theatres show it (0 = first theatre above, 1 = second, ...)
const art=m=>`<span class="ini">${m.t[0]}</span>`+(m.img?`<img class="art" src="${m.img}" alt="" onerror="this.remove()">`:"");
const f=t=>{let h=Math.floor(t),m=Math.round((t-h)*60);const ap=h%24>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap};
// Demo screen number: movies at a theatre are spread over its screens in order
const screenOf=(i,t)=>movies.filter(m=>m.th.includes(t)).indexOf(movies[i])%theatres[t].sc+1;
const all=[];movies.forEach((m,i)=>m.th.forEach(t=>m.times.forEach(s0=>{const st=s0+theatres[t].sh;all.push({k:i+"-"+t+"-"+st,name:m.t,th:theatres[t].n,scr:screenOf(i,t),t,s:st,e:st+m.d/60,dur:m.d,p:m.p})})));
const sel=new Set();const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let city=store.get("st_city")||"Hyderabad";
let user=null;try{user=JSON.parse(store.get("st_user")||"null")}catch(e){}
const urlU=new URLSearchParams(location.search).get("u");
if(/^[6-9]\d{9}$/.test(urlU||"")){user={mobile:urlU};store.set("st_user",JSON.stringify(user))}
let curTh=0,query="";
function renderTh(){
  $("th").innerHTML=theatres.map((t,i)=>`<button aria-pressed="${i===curTh}" data-t="${i}">${t.n}</button>`).join("");
  const pa=theatres[curTh].a.split(" · ");$("thinfo").textContent=pa[0]+", "+city+" · "+pa[1]+" · "+movies.filter(m=>m.th.includes(curTh)).length+" movies today"}
function renderList(){
  $("list").innerHTML=movies.map((m,i)=>!m.th.includes(curTh)||!m.t.toLowerCase().includes(query)?"":`<section class="movie" id="m-${i}"><div class="poster" style="background:linear-gradient(160deg,${m.c})">${art(m)}</div><div class="info"><h3>${m.t}</h3><div class="rating"><span class="star">★</span> <b>${m.r}</b>/10 <small>· ${m.v} votes</small></div><div class="meta">${m.g} · ${Math.floor(m.d/60)}h ${m.d%60}m · ₹${m.p} · Screen ${screenOf(i,curTh)}</div><div class="times">${m.times.map(s0=>{const st=s0+theatres[curTh].sh,k=i+"-"+curTh+"-"+st;return `<button class="t" aria-pressed="${sel.has(k)}" data-k="${k}">${f(st)}<small>ends ${f(st+m.d/60)}</small></button>`}).join("")}</div></div></section>`).join("")}
function renderAll(){renderTh();renderList()}
$("th").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;curTh=+b.dataset.t;renderAll();count()};
renderAll();
function count(){$("cnt").textContent=sel.size?sel.size+" show"+(sel.size>1?"s":"")+" selected":"No shows selected (all shows at "+theatres[curTh].n+" will be used)"}
$("list").onclick=e=>{const b=e.target.closest(".t");if(!b)return;const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute("aria-pressed",sel.has(k));count()};
$("reset").onclick=()=>{sel.clear();document.querySelectorAll(".t").forEach(b=>b.setAttribute("aria-pressed","false"));$("plan").innerHTML="";count()};
$("go").onclick=()=>{
  const pool=all.filter(s=>sel.size?sel.has(s.k):s.t===curTh);
  // Greedy activity selection: sort by end time, pick if start >= last end
  const order=[...pool].sort((a,b)=>a.e-b.e||a.s-b.s);
  let last=-Infinity;const pick=[],log=[];
  order.forEach(s=>{if(s.s>=last){pick.push(s);log.push(`<li><span class="ok">Picked</span> ${s.name} at ${s.th}, ${f(s.s)}–${f(s.e)}</li>`);last=s.e}
   else log.push(`<li><span class="no">Skipped ${s.name} at ${s.th}, ${f(s.s)}: starts before ${f(last)} when your last pick ends.</span></li>`)});
  pick.sort((a,b)=>a.s-b.s);
  $("plan").innerHTML=`<div class="plan"><h2>You can watch <b>${pick.length}</b> of ${pool.length} shows</h2><span class="sub">No two overlap. Back-to-back shows are allowed. Travel time between theatres is not counted.</span>
  <div class="tix">${pick.map(s=>`<div class="tk"><b>${s.name}</b><span>${f(s.s)} – ${f(s.e)}</span><br><span>${s.th} · Screen ${s.scr}</span></div>`).join("")}</div>
  <button class="b" id="book">Proceed to payment</button>
  <details><summary>Why these shows? (greedy steps)</summary><ol>${log.join("")}</ol><p class="sub">Shows are sorted by end time, then each is taken if it starts after the last pick ends. Time O(n log n).</p></details></div>`;
  $("book").onclick=()=>{const d=pick.map(x=>({n:x.name,th:x.th,sc:x.scr,s:x.s,e:x.e,p:x.p}));location.href="payment.html?c="+encodeURIComponent(city)+"&d="+encodeURIComponent(JSON.stringify(d))};
  window.scrollTo({top:0,behavior:"smooth"})};


/* ---------- Auto-sliding featured movies ---------- */
const hero=$("hero");let cur=0,timer=null;
const bgOf=m=>m.img?`url('${m.img}') center/cover`:`linear-gradient(160deg,${m.c})`;
hero.innerHTML=`<div class="slides" id="slides">${movies.map((m,i)=>`<div class="slide" role="group" aria-roledescription="slide" aria-label="${i+1} of ${movies.length}"><div class="bg" style="background:linear-gradient(160deg,${m.c})">${m.img?`<img class="art" src="${m.img}" alt="" onerror="this.remove()">`:""}</div><div class="cap"><span class="chip">Now showing</span><h2>${m.t}</h2><p>${m.g}</p><p class="rt">\u2605 ${m.r}/10 \u00b7 ${m.v} votes</p><button class="b" data-go="${i}">Book now</button></div><div class="pic" style="background:linear-gradient(160deg,${m.c})">${art(m)}</div></div>`).join("")}</div><button class="nv prev" aria-label="Previous movie">\u2039</button><button class="nv next" aria-label="Next movie">\u203a</button><div class="dots">${movies.map((_,i)=>`<button data-d="${i}" aria-label="Show movie ${i+1}"></button>`).join("")}</div>`;
function show(i){cur=(i+movies.length)%movies.length;$("slides").style.transform=`translateX(-${cur*100}%)`;hero.querySelectorAll(".dots button").forEach((b,k)=>b.setAttribute("aria-current",k===cur))}
function play(){clearInterval(timer);if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;timer=setInterval(()=>{if(!document.hidden)show(cur+1)},4000)}
function stop(){clearInterval(timer)}
hero.onclick=e=>{
  const g=e.target.closest("[data-go]"),d=e.target.closest("[data-d]");
  if(g){const gi=+g.dataset.go;if(!movies[gi].th.includes(curTh)){curTh=movies[gi].th[0];renderAll();count()}const m=$("m-"+gi);m.scrollIntoView({behavior:"smooth",block:"center"});m.classList.add("flash");setTimeout(()=>m.classList.remove("flash"),1400)}
  else if(d)show(+d.dataset.d);
  else if(e.target.closest(".prev"))show(cur-1);
  else if(e.target.closest(".next"))show(cur+1)};
hero.onmouseenter=stop;hero.onmouseleave=play;hero.onfocusin=stop;hero.onfocusout=play;
let tx=0;hero.ontouchstart=e=>{tx=e.touches[0].clientX};
hero.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){show(cur+(dx<0?1:-1))}};
show(0);play();

/* ---------- Header: search, city, sign in, menu (demo, data stays in this browser) ---------- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cities=[["Hyderabad",17.385,78.4867],["Bengaluru",12.9716,77.5946],["Chennai",13.0827,80.2707],["Mumbai",19.076,72.8777],["Delhi-NCR",28.6139,77.209],["Kolkata",22.5726,88.3639],["Pune",18.5204,73.8567],["Ahmedabad",23.0225,72.5714],["Kochi",9.9312,76.2673],["Vijayawada",16.5062,80.648],["Visakhapatnam",17.6868,83.2185],["Jaipur",26.9124,75.7873]];
const ulabel=u=>u.name||(u.mobile.slice(0,2)+"••••"+u.mobile.slice(-3));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
let lastFocus=null;
function openOv(id){lastFocus=document.activeElement;$(id).classList.add("show")}
function openDrawer(){lastFocus=document.activeElement;drawDrawer();$("drawer").classList.add("show");$("bd").classList.add("show");$("dx").focus()}
function closeAll(){document.querySelectorAll(".ov.show,.drawer.show,.bd.show").forEach(e=>e.classList.remove("show"));if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
$("bd").onclick=closeAll;
["cityOv","ordOv"].forEach(id=>$(id).onclick=e=>{if(e.target.id===id)closeAll()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
$("q").oninput=e=>{query=e.target.value.trim().toLowerCase();renderList()};

// city
function drawCities(filter){const q=(filter||"").trim().toLowerCase();
  $("cityGrid").innerHTML=cities.filter(c=>c[0].toLowerCase().includes(q)).map(c=>`<button class="cc" data-c="${c[0]}" aria-pressed="${c[0]===city}">${c[0]}</button>`).join("")||'<p class="sub">No city found.</p>'}
function setCity(c){city=c;store.set("st_city",c);$("cityName").textContent=c;renderTh();closeAll();toast("Showing theatres in "+c)}
$("cityBtn").onclick=()=>{drawCities("");$("cmsg").textContent="";$("cq").value="";openOv("cityOv");$("cq").focus()};
$("cq").oninput=e=>drawCities(e.target.value);
$("cityGrid").onclick=e=>{const b=e.target.closest("[data-c]");if(b)setCity(b.dataset.c)};
$("detect").onclick=()=>{
  if(!navigator.geolocation){$("cmsg").textContent="Location is not available in this browser.";return}
  $("cmsg").textContent="Detecting your location...";
  navigator.geolocation.getCurrentPosition(pos=>{
    const a=pos.coords.latitude,b=pos.coords.longitude,R=Math.PI/180;
    const d=c=>{const dx=(c[2]-b)*R*Math.cos(a*R),dy=(c[1]-a)*R;return dx*dx+dy*dy};
    setCity(cities.reduce((m,c)=>d(c)<d(m)?c:m)[0])},
    ()=>{$("cmsg").textContent="Could not detect your location. Please choose a city."},{timeout:8000})};

// sign in state
function renderUser(){const a=$("signin");
  if(user){a.textContent="Hi, "+ulabel(user);a.removeAttribute("href");a.setAttribute("role","button");a.tabIndex=0}
  else{a.textContent="Sign in";a.setAttribute("href","login.html");a.removeAttribute("role")}}
$("signin").onclick=e=>{if(user){e.preventDefault();openDrawer()}};
$("signin").onkeydown=e=>{if(user&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openDrawer()}};
$("menuBtn").onclick=openDrawer;

// menu drawer
function showOrders(){
  closeAll();let o=[];try{o=JSON.parse(store.get("st_orders")||"[]")}catch(e){}
  $("ordList").innerHTML=o.length?o.map(x=>`<div class="ord"><b>Booking ${esc(x.id)}</b> <small>${esc(new Date(x.at).toLocaleString())}${x.city?" · "+esc(x.city):""}</small>${(x.items||[]).map(i=>`<div>${esc(i.n)} · ${f(+i.s)}–${f(+i.e)}${i.th?" · "+esc(i.th):""}${i.sc?" · Screen "+esc(i.sc):""}</div>`).join("")}<div><b>₹${Number(x.total).toLocaleString("en-IN")}</b> · ${esc(x.seats)} ticket(s) per show · ${esc(x.how)}</div></div>`).join(""):'<p class="sub">No bookings yet. Book a show and it will appear here.</p>';
  openOv("ordOv")}
const items=[["Notifications","",0,()=>toast("No new notifications.")],
["Your Orders","View all your bookings & purchases",1,showOrders],
["Your Wishlist","",0,()=>toast("Your wishlist is empty. (demo)")],
["Help & Support","View commonly asked queries and chat",0,()=>toast("Help & Support is a demo screen.")],
["Accounts & Settings","Location, payments, permissions & more",1,()=>toast("Accounts & Settings is a demo screen.")],
["Rewards","View your rewards & unlock new ones",0,()=>toast("No rewards yet. Book a show to earn some. (demo)")]];
function drawDrawer(){
  $("dbody").innerHTML=(user?`<div class="dcard"><div><b>Hi, ${esc(ulabel(user))}</b><br><small>Signed in (demo account)</small></div></div>`
   :`<div class="dcard"><span class="gift" aria-hidden="true">🎁</span><p>Unlock special offers &amp; great benefits</p><a class="btnlink" href="login.html">Login / Register</a></div>`)
  +items.map((it,i)=>`<button class="ditem${it[2]&&!user?" lock":""}" data-i="${i}"><span><b>${it[0]}</b>${it[1]?`<small>${it[1]}</small>`:""}</span><span aria-hidden="true">${it[2]&&!user?"🔒":"›"}</span></button>`).join("")
  +(user?`<button class="ditem" id="out"><span><b>Sign out</b></span><span aria-hidden="true">›</span></button>`:"")}
$("dbody").onclick=e=>{const b=e.target.closest(".ditem");if(!b)return;
  if(b.id==="out"){store.del("st_user");user=null;renderUser();drawDrawer();toast("Signed out");return}
  const it=items[+b.dataset.i];if(it[2]&&!user){location.href="login.html";return}it[3]()};
renderUser();$("cityName").textContent=city;
count();
</script>
